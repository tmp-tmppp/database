# CI/CD of the database. The steps live in the organization's shared workflow (RSO-ekipa10/.github,
# .github/workflows/service-ci-cd.yml, ADR-051); this file only says when it runs and with which settings. The
# database has no code and no image of its own (the official PostgreSQL image, pinned by digest in the chart), so it
# calls the shared workflow with build-image: false: no Node.js steps, no image build, push or digest, and the chart
# gets no image values. The rules of the database that the shared workflow does not know stay in chart-ci.yml.
#   pull request   job "pipeline / test": workflow lint, Helm 4, chart lint and schema check (dev and prod values),
#                  helm test hook; job "chart-rules / test": workflow lint, strict chart lint, manifests against the
#                  Kubernetes schemas, rules of the database, schema refusals, the setup script against a throwaway
#                  PostgreSQL server
#   push to main   the same checks, then the Secret database-env from the organization secret DATABASE_ENV, the Helm
#                  deploy of the chart to prod (the setup Job runs as a hook), the access test (helm test) and the
#                  rollback when it fails; the job "pipeline" starts only when "chart-rules" passed
#   manual run     redeploy or roll back to the chart of an earlier commit of main (input "sha")
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Redeploy or roll back to the chart of this full commit SHA from main (empty = newest commit)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Pull requests: a newer push cancels the older run. Main and manual runs from main share one
  # group, and a newer run never cancels a running one (a killed "helm upgrade" leaves the
  # release stuck). A manual run from another branch gets its own group and deploys nothing.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    # The job id "pipeline" calling the job "test" gives the check name "pipeline / test",
    # the name the branch ruleset of the services requires.
    # A push to main deploys only when "chart-rules" passed; a pull request runs both jobs and shows both results,
    # and a manual run has no "chart-rules" (it only redeploys a commit already checked on main).
    needs: chart-rules
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.chart-rules.result == 'success') }}
    permissions:
      contents: read
      id-token: write # Azure login with OIDC in the deploy job
    # TO DO AFTER org-github IS PUSHED: the input build-image exists only in the commit of RSO-ekipa10/.github that
    # adds it (as for the broker). Pin this line to a commit SHA when the release tag exists:
    #   uses: RSO-ekipa10/.github/.github/workflows/service-ci-cd.yml@<40-character SHA> # <tag>
    uses: tmp-tmppp/.github/.github/workflows/service-ci-cd.yml@main
    with:
      service: database # also the Helm release name and the prefix of the Secret database-env
      build-image: false
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      sha: ${{ inputs.sha }}
    secrets:
      # Named secrets only (no "inherit"). No Docker Hub token: nothing is pushed.
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }} # secrets, so the public logs mask them
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # KEY=value lines: POSTGRES_PASSWORD and one <SERVICE>_DB_PASSWORD per role (README, "The Secret").
      app-env: ${{ secrets.DATABASE_ENV }}

  chart-rules:
    # The checks of the database itself, in chart-ci.yml (the job id test inside it gives "chart-rules / test").
    # A manual run only redeploys a commit that was already checked on main.
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/chart-ci.yml
